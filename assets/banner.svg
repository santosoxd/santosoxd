<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Glow Filter -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); }
      100% { transform: translateY(260px); }
    }
    .grid-line { stroke: #1e3a5f; stroke-width: 0.75; opacity: 0.35; }
    .neon-pulse { animation: pulseGlow 3s ease-in-out infinite; }
  </style>

  <!-- Base Card -->
  <rect width="850" height="260" rx="16" fill="url(#bg)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Subtle Tech Grid -->
  <g class="grid-line">
    <line x1="0" y1="52" x2="850" y2="52"/>
    <line x1="0" y1="104" x2="850" y2="104"/>
    <line x1="0" y1="156" x2="850" y2="156"/>
    <line x1="0" y1="208" x2="850" y2="208"/>
    <line x1="170" y1="0" x2="170" y2="260"/>
    <line x1="340" y1="0" x2="340" y2="260"/>
    <line x1="510" y1="0" x2="510" y2="260"/>
    <line x1="680" y1="0" x2="680" y2="260"/>
  </g>

  <!-- Circuit nodes -->
  <circle cx="170" cy="104" r="3.5" fill="#00f2fe" class="neon-pulse"/>
  <circle cx="510" cy="156" r="3.5" fill="#00f2fe" class="neon-pulse"/>
  <circle cx="680" cy="52" r="3" fill="#3b82f6"/>

  <!-- Top Status Chip -->
  <g transform="translate(48, 32)">
    <rect width="180" height="26" rx="13" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
      OPEN TO INNOVATION
    </text>
  </g>

  <!-- Location Chip -->
  <g transform="translate(640, 32)">
    <text x="0" y="18" font-family="'Consolas', monospace" font-size="12" fill="#64748b">
      LOCATION // <tspan fill="#38bdf8">LISBON, PT</tspan>
    </text>
  </g>

  <!-- Main Name Title -->
  <text x="48" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="2">
    FILIPE NETO CUNHA
  </text>

  <!-- Subtitle with Glowing Cyan -->
  <text x="48" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="url(#cyanBlue)" letter-spacing="3">
    SOFTWARE ENGINEER &bull; DESKTOP &amp; DISTRIBUTED SYSTEMS
  </text>

  <!-- Terminal Style Status line -->
  <g transform="translate(48, 192)">
    <!-- Terminal pill box -->
    <rect width="754" height="42" rx="8" fill="#091424" stroke="#1e3a5f" stroke-width="1"/>
    <circle cx="20" cy="21" r="4" fill="#ef4444"/>
    <circle cx="34" cy="21" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="21" r="4" fill="#10b981"/>

    <text x="70" y="26" font-family="'Consolas', 'Fira Code', monospace" font-size="13" fill="#60a5fa">
      const <tspan fill="#e2e8f0">developer</tspan> = { <tspan fill="#94a3b8">focus:</tspan> <tspan fill="#38bdf8">"C# / .NET"</tspan>, <tspan fill="#94a3b8">code:</tspan> <tspan fill="#38bdf8">"Robust &amp; Zero-Fluff"</tspan>, <tspan fill="#94a3b8">status:</tspan> <tspan fill="#10b981">"Building"</tspan> };
    </text>
  </g>
</svg>
